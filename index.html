<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자산</title>
<style>
:root{
  --bg:#f2f4f6;--card:#fff;--fg:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#f2f4f6;--field:#f2f4f6;--primary:#3182f6;
  --glass:rgba(255,255,255,.72);--glass-b:rgba(255,255,255,.6);--shadow:0 8px 32px rgba(0,0,0,.14);
  --r:20px;
  --c-cash:#3182f6;--c-fx:#f59f00;--c-save:#00b386;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17171c;--card:#202027;--fg:#f9fafb;--sub:#c3c8d1;--mute:#8b95a1;--line:#2c2c35;--field:#2c2c35;--primary:#4593fc;
  --glass:rgba(40,40,48,.7);--glass-b:rgba(255,255,255,.08);--shadow:0 8px 32px rgba(0,0,0,.5);
  --c-cash:#4593fc;--c-fx:#ffb724;--c-save:#1fc99b}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard",-apple-system,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 72%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.hin{max-width:520px;margin:0 auto;height:calc(68px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 20px 0;display:flex;align-items:center;justify-content:space-between}
h1{font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0}
.add{width:40px;height:40px;border-radius:50%;border:0;padding:0;background:color-mix(in srgb,var(--primary) 14%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--primary);cursor:pointer;display:flex;align-items:center;justify-content:center}
.add svg{display:block;width:18px;height:18px}
.add:active{transform:scale(.92)}
main{max-width:520px;margin:0 auto;padding:4px 20px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r)}
.chart-card{padding:28px 20px;margin-bottom:12px}
.chart{position:relative;width:min(100%,300px);margin:0 auto;aspect-ratio:1}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.seg{fill:none;stroke-width:24;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.seg.on{stroke-width:30}
.dim .seg:not(.on){opacity:.3}
.ring-empty{fill:none;stroke:var(--line);stroke-width:24}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.center b{font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;flex:none;min-width:46px;text-align:center;font-size:11px;line-height:1;padding:5px 8px;border-radius:999px;font-weight:600;color:#fff;background:var(--pc)}
.t-cash{--pc:var(--c-cash)}.t-fx{--pc:var(--c-fx)}.t-save{--pc:var(--c-save)}
#tip{position:fixed;z-index:20;pointer-events:none;min-width:150px;max-width:240px;padding:14px 16px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip .pill{margin-bottom:10px}
#tip .n{font-size:14px;font-weight:600;margin-bottom:4px;word-break:break-all}
#tip .a{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
#tip .k{font-size:12px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
.list{padding:8px 8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:10px;padding:16px 12px;border-radius:14px;cursor:pointer;transition:background .15s,transform .15s}
.row.press{background:var(--field);transform:scale(.985)}
.row .nm{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.row .r b{display:block;font-size:15px;font-weight:700}
.row .r small{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.open{display:flex;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{width:100%;max-width:380px;border-radius:28px;padding:24px 20px 20px;background:var(--card);box-shadow:var(--shadow);animation:u .2s cubic-bezier(.2,.8,.2,1)}
@keyframes u{from{transform:translateY(16px);opacity:0}}
.modal h2{margin:0 0 20px 4px;font-size:20px;font-weight:700;letter-spacing:-.03em}
.seg-t{display:flex;gap:4px;margin-bottom:12px;padding:4px;border-radius:16px;background:var(--field)}
.seg-t button{flex:1;padding:10px 0;border-radius:12px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg-t button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select{width:100%;padding:16px;border-radius:16px;border:2px solid transparent;background:var(--field);color:var(--fg);font:inherit;font-size:16px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--mute);font-weight:400}
input:focus,select:focus{border-color:var(--primary)}
.f{display:block;margin-bottom:8px}
.amt{display:flex;gap:8px}.amt select{width:96px;flex:none;text-align:center}
.btns{display:flex;gap:8px;margin-top:20px}
.btns button{flex:1;padding:16px 0;border-radius:16px;border:0;background:var(--field);color:var(--sub);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btns button:active{transform:scale(.97)}
.btns .ok{background:var(--primary);color:#fff;flex:1.6}
.btns .del{background:color-mix(in srgb,#f04452 12%,transparent);color:#f04452;flex:.7}
.hide{display:none!important}
</style>
</head>
<body>
<header><div class="hin"><h1>자산</h1><button class="add" id="add" aria-label="추가"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2.5v13M2.5 9h13"/></svg></button></div></header>
<main>
  <div class="card chart-card"><div class="chart" id="chart">
    <svg viewBox="0 0 200 200" id="svg"></svg>
    <div class="center"><b id="total">₩0</b></div>
  </div></div>
  <div class="card list" id="list"></div>
</main>
<div id="tip"></div>
<div class="ov" id="ov"><form class="modal" id="form" autocomplete="off">
  <h2 id="mt">종목 추가</h2>
  <div class="seg-t" id="types"></div>
  <label class="f"><input id="name" placeholder="계좌명" required maxlength="30"></label>
  <div class="amt">
    <select id="cur" class="hide"></select>
    <input id="amount" placeholder="금액" inputmode="decimal" required>
  </div>
  <div class="btns">
    <button type="button" class="del hide" id="del">삭제</button>
    <button type="button" id="cancel">취소</button>
    <button type="submit" class="ok">저장</button>
  </div>
</form></div>
<script>
const TYPES={cash:'입출금',fx:'외화',save:'예적금'};
const CURS={USD:'$',JPY:'¥',CNY:'CN¥'};
const COLORS={cash:'--c-cash',fx:'--c-fx',save:'--c-save'};
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('assets',[]);
let rates=ls.get('rates',{USD:0,JPY:0,CNY:0}); // KRW per 1 unit
let editId=null,curType='cash';
const fmt=(n,d=0)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const krw=i=>i.type==='fx'?i.amount*(rates[i.cur]||0):i.amount;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=i=>i.type==='fx'?CURS[i.cur]+fmt(i.amount,i.cur==='JPY'?0:2):'₩'+fmt(i.amount);
const sub=i=>i.type==='fx'&&rates[i.cur]?'≈ ₩'+fmt(Math.round(krw(i))):'';
const pill=t=>`<span class="pill t-${t}">${TYPES[t]}</span>`;

// colors: per-type hue, varying lightness per account
function shade(i,idx){
  const base=css(COLORS[i.type]);
  const same=items.filter(x=>x.type===i.type);
  const k=same.indexOf(i);
  return `color-mix(in srgb, ${base} ${Math.max(45,100-k*14)}%, ${css('--bg')})`;
}

function arc(a0,a1,r){
  const p=a=>[100+r*Math.sin(a),100-r*Math.cos(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;
}

function render(){
  const total=items.reduce((s,i)=>s+krw(i),0);
  $('#total').textContent='₩'+fmt(Math.round(total));
  const svg=$('#svg');
  let h='<circle class="ring-empty" cx="100" cy="100" r="78"/>';
  if(total>0){
    let a=0;const gap=items.length>1?0.025:0;
    items.forEach(i=>{
      const v=krw(i);if(v<=0)return;
      const span=v/total*Math.PI*2;
      const s=a+gap/2,e=Math.min(a+span-gap/2,a+Math.PI*2-0.0001);
      h+=`<path class="seg" data-id="${i.id}" d="${arc(s,Math.max(e,s+0.001),78)}" stroke="${shade(i)}"/>`;
      a+=span;
    });
  }
  svg.innerHTML=h;
  $('#list').innerHTML=items.map(i=>`<div class="row" data-id="${i.id}">${pill(i.type)}<span class="nm">${esc(i.name)}</span>
    <div class="r"><b>${main(i)}</b>${sub(i)?`<small>${sub(i)}</small>`:''}</div></div>`).join('');
}

// tooltip
const tip=$('#tip');
function showTip(id,x,y){
  const i=items.find(v=>v.id===id);if(!i)return;
  tip.innerHTML=`${pill(i.type)}<div class="n">${esc(i.name)}</div><div class="a">${main(i)}</div>${sub(i)?`<div class="k">${sub(i)}</div>`:''}`;
  tip.classList.add('show');
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  let l=x+16,t=y-hh-14;
  if(l+w>innerWidth-10)l=x-w-16;
  if(l<10)l=10;
  if(t<10)t=y+18;
  tip.style.left=l+'px';tip.style.top=t+'px';
  $('#chart').classList.add('dim');
  document.querySelectorAll('.seg').forEach(s=>s.classList.toggle('on',s.dataset.id===id));
}
function hideTip(){tip.classList.remove('show');$('#chart').classList.remove('dim');document.querySelectorAll('.seg.on').forEach(s=>s.classList.remove('on'))}
const svgEl=$('#svg');
function probe(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList&&el.classList.contains('seg'))showTip(el.dataset.id,e.clientX,e.clientY);else hideTip();
}
svgEl.addEventListener('pointermove',probe);
svgEl.addEventListener('pointerdown',probe);
svgEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#svg'))hideTip()});

// amount input
const amtEl=$('#amount');
const decOk=()=>curType==='fx'&&$('#cur').value!=='JPY';
function fmtAmt(raw){
  let v=raw.replace(/[^\d.]/g,'');
  const dot=decOk()&&v.includes('.');
  const p=v.split('.');
  let int=p[0].replace(/^0+(?=\d)/,'');
  const out=int.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dot?out+'.'+p.slice(1).join('').slice(0,2):out;
}
function reAmt(){
  const pos=amtEl.selectionStart??amtEl.value.length;
  const n=amtEl.value.slice(0,pos).replace(/[^\d.]/g,'').length;
  amtEl.value=fmtAmt(amtEl.value);
  let c=0,k=0;
  for(;k<amtEl.value.length&&c<n;k++)if(/[\d.]/.test(amtEl.value[k]))c++;
  try{amtEl.setSelectionRange(k,k)}catch{}
}
amtEl.addEventListener('input',reAmt);
$('#cur').addEventListener('change',reAmt);

// modal
function buildTypes(){
  $('#types').innerHTML=Object.entries(TYPES).map(([k,v])=>`<button type="button" data-t="${k}" class="${k===curType?'on':''}">${v}</button>`).join('');
  $('#cur').classList.toggle('hide',curType!=='fx');
}
$('#cur').innerHTML=Object.keys(CURS).map(c=>`<option>${c}</option>`).join('');
$('#types').onclick=e=>{const b=e.target.closest('button');if(!b)return;curType=b.dataset.t;buildTypes();reAmt()};
function openModal(id){
  editId=id||null;const i=items.find(v=>v.id===id);
  curType=i?i.type:'cash';
  $('#mt').textContent=i?'종목 수정':'종목 추가';
  $('#name').value=i?i.name:'';
  $('#amount').value='';
  $('#cur').value=i&&i.cur?i.cur:'USD';
  $('#del').classList.toggle('hide',!i);
  buildTypes();if(i)amtEl.value=fmtAmt(String(i.amount));$('#ov').classList.add('open');
  setTimeout(()=>$('#name').focus(),50);
}
const closeModal=()=>$('#ov').classList.remove('open');
$('#add').onclick=()=>openModal();
$('#cancel').onclick=closeModal;
$('#ov').addEventListener('pointerdown',e=>{if(e.target.id==='ov')closeModal()});
$('#del').onclick=()=>{items=items.filter(v=>v.id!==editId);save();closeModal()};
$('#form').onsubmit=e=>{
  e.preventDefault();
  const amount=parseFloat($('#amount').value.replace(/,/g,''));
  const name=$('#name').value.trim();
  if(!name||isNaN(amount)||amount<0)return;
  const o={id:editId||String(Date.now()),type:curType,name,amount:curType==='fx'?amount:Math.round(amount)};
  if(curType==='fx')o.cur=$('#cur').value;
  if(editId)items=items.map(v=>v.id===editId?o:v);else items.push(o);
  save();closeModal();
};
function save(){ls.set('assets',items);render()}

// long press
let pt=null,pressed=false,sx=0,sy=0;
const list=$('#list');
list.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.row');if(!r)return;
  pressed=false;sx=e.clientX;sy=e.clientY;r.classList.add('press');
  pt=setTimeout(()=>{pressed=true;r.classList.remove('press');navigator.vibrate&&navigator.vibrate(10);openModal(r.dataset.id)},500);
});
const cancelP=()=>{clearTimeout(pt);document.querySelectorAll('.row.press').forEach(r=>r.classList.remove('press'))};
list.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)cancelP()});
['pointerup','pointerleave','pointercancel'].forEach(t=>list.addEventListener(t,cancelP));
list.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// rates (free, no key)
async function loadRates(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/KRW');
    const j=await r.json();
    if(j.rates){for(const c of Object.keys(CURS))if(j.rates[c])rates[c]=1/j.rates[c]}
  }catch{
    try{
      const r=await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,CNY');
      const j=await r.json();
      for(const c of Object.keys(CURS))if(j.rates&&j.rates[c])rates[c]=1/j.rates[c];
    }catch{}
  }
  ls.set('rates',rates);render();
}
render();loadRates();setInterval(loadRates,300000);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
</script>
</body>
</html>
