<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>자산</title>
<style>
:root{
  --bg:#fff;--card:#fff;--fg:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#e5e8eb;--field:#f2f4f6;--primary:#3182f6;
  --glass:rgba(255,255,255,.72);--glass-b:rgba(255,255,255,.6);--shadow:0 8px 32px rgba(0,0,0,.14);
  --r:16px;--ico:38px;
  --c-cash:#3182f6;--c-fx:#f59f00;--c-save:#00b386;--c-in:#8b5cf6;--c-out:#f04452;--c-sec:#ec4899;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17171c;--card:#17171c;--fg:#f9fafb;--sub:#c3c8d1;--mute:#8b95a1;--line:#2c2c35;--field:#2c2c35;--primary:#4593fc;
  --glass:rgba(40,40,48,.7);--glass-b:rgba(255,255,255,.08);--shadow:0 8px 32px rgba(0,0,0,.5);
  --c-cash:#4593fc;--c-fx:#ffb724;--c-save:#1fc99b;--c-in:#a78bfa;--c-out:#ff6b78;--c-sec:#f472b6}
  header{background:rgba(23,23,28,.55)}
  nav{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06))!important;border-color:rgba(255,255,255,.16)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 8px 28px rgba(0,0,0,.5)!important}
  nav .ind{background:rgba(255,255,255,.12)!important}
  .add{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08))!important;border-color:rgba(255,255,255,.18)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.4)!important}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard",-apple-system,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}
.hin{max-width:520px;margin:0 auto;height:calc(66px + env(safe-area-inset-top));padding:calc(16px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
h1{cursor:text;padding:3px 0;outline:none;min-width:24px;font-size:17px;line-height:1;font-weight:700;letter-spacing:-.02em;margin:0}
.add{width:var(--ico);min-width:var(--ico);height:var(--ico);margin-left:auto;border-radius:50%;border:0;padding:0;flex:none;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.add svg{display:block;width:16px;height:16px}
.add:active{transform:scale(.92)}
.ava{width:var(--ico);min-width:var(--ico);height:var(--ico);border-radius:50%;background:color-mix(in srgb,var(--mute) 22%,var(--bg));color:var(--mute);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.ava svg{width:50px;height:50px;flex:none;display:block;margin-bottom:-6px}
main{max-width:520px;margin:0 auto;padding:calc(68px + env(safe-area-inset-top)) 16px calc(132px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r)}
.chart-card{padding:20px 16px 28px;margin-bottom:0}
.chart{position:relative;width:min(100%,236px);margin:0 auto;aspect-ratio:1}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.seg{fill:none;stroke-width:20;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.seg.on{stroke-width:25}
.dim .seg:not(.on){opacity:.3}
.ring-empty{fill:none;stroke:var(--line);stroke-width:20}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none}
.mo{position:absolute;left:0;right:0;bottom:calc(50% + 17px);display:flex;align-items:center;justify-content:center;gap:0;font-size:13px;font-weight:600;color:var(--sub);pointer-events:auto}
.mo span{line-height:1}
.dl:empty{display:none}
.dl{margin-top:18px;text-align:center;font-size:12px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.nb{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.nb.l{left:-46px}.nb.r{right:-46px}
.nb:active{background:var(--field)}
.nb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mo button{width:24px;height:24px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mo button:active{background:var(--field)}
.mo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg.dash{stroke-dasharray:4 3}
.t-sec{--pc:var(--c-sec)}
.t-in{--pc:var(--c-in)}.t-out{--pc:var(--c-out)}
.row.flow{cursor:default}
.row.ex{outline:1px dashed var(--line);outline-offset:-1px}
.row.ex .pill{background:transparent;color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.center b{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;flex:none;min-width:40px;text-align:center;font-size:10px;line-height:1;padding:4px 7px;border-radius:999px;font-weight:600;color:#fff;background:var(--pc)}
.t-cash{--pc:var(--c-cash)}.t-fx{--pc:var(--c-fx)}.t-save{--pc:var(--c-save)}
#tip{position:fixed;z-index:20;pointer-events:none;min-width:200px;max-width:300px;padding:12px 14px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip .h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#tip .n{font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip .a{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#tip .k{font-size:10px;font-weight:400;color:var(--mute);margin-left:8px;font-variant-numeric:tabular-nums}
.list{position:relative;border-radius:0;border-top:1px solid var(--line);padding:10px 6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:8px;padding:18px 10px;border-radius:12px;cursor:pointer;touch-action:pan-y;transition:background .15s,transform .2s}
.row.press{background:var(--field)}
.row.drag{position:relative;z-index:5;background:var(--card);box-shadow:var(--shadow);transition:none;cursor:grabbing}
.row .nm{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.row .r b{display:block;font-size:13px;font-weight:700}
.row .r small{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.open{display:flex;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{width:100%;max-width:320px;border-radius:24px;padding:20px 16px 16px;background:var(--card);box-shadow:var(--shadow);animation:u .2s cubic-bezier(.2,.8,.2,1)}
@keyframes u{from{transform:translateY(16px);opacity:0}}
.modal h2{margin:0 0 14px 4px;font-size:16px;font-weight:700;letter-spacing:-.03em}
.seg-t{display:flex;gap:4px;margin-bottom:12px;padding:3px;border-radius:14px;background:var(--field)}
.seg-t button{flex:1;padding:8px 0;border-radius:11px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.seg-t button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid transparent;background:var(--field);color:var(--fg);font:inherit;font-size:16px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--mute);font-weight:400}
input:focus,select:focus{border-color:var(--primary)}
.f{display:block;margin-bottom:8px}
.amt{display:flex;gap:8px}.amt select{width:80px;flex:none;text-align:center}
.btns{display:flex;gap:6px;margin-top:14px}
.btns button{flex:1;padding:13px 0;border-radius:14px;border:0;background:var(--field);color:var(--sub);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btns button:active{transform:scale(.97)}
.btns .ok{background:var(--primary);color:#fff;flex:1.6}
.btns .del{background:color-mix(in srgb,#f04452 12%,transparent);color:#f04452;flex:.7}
.hide{display:none!important}
.view{display:none}
.view.on{display:block;animation:vr .32s cubic-bezier(.2,.8,.2,1)}
.view.on.fl{animation-name:vl}
@keyframes vr{from{opacity:0;transform:translateX(28px)}}
@keyframes vl{from{opacity:0;transform:translateX(-28px)}}
.dock{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(calc(100% - 80px),300px);display:flex;gap:10px}
.dock .add{width:52px;min-width:52px;height:52px;margin:0}
.dock .add svg{width:20px;height:20px}
nav{position:relative;flex:1;height:52px;padding:4px;display:grid;grid-template-columns:repeat(2,1fr);border-radius:26px;
  background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 6px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.14),0 1px 4px rgba(0,0,0,.08)}
nav .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:22px;background:rgba(0,0,0,.06);box-shadow:inset 0 1px 1px rgba(255,255,255,.8);transition:transform .35s cubic-bezier(.3,1.2,.4,1)}
nav button{position:relative;border:0;background:transparent;color:var(--mute);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0;transition:color .2s}
nav button.on{color:var(--fg)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:10px;font-weight:600;line-height:1}
.add.off{visibility:hidden;pointer-events:none}
.row{flex-wrap:wrap}
.detail{flex:0 0 100%;order:5;margin-top:12px;padding-top:6px;border-top:1px solid var(--line);animation:dx .22s ease}
@keyframes dx{from{opacity:0;transform:translateY(-6px)}}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px}
.fl .k{color:var(--mute);flex:none;width:56px}
.fl input,.fl select{width:auto;flex:1;min-width:0;text-align:right;text-align-last:right;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:inherit;font-size:16px;font-weight:500;pointer-events:none;-webkit-appearance:none;appearance:none;opacity:1}
.detail.edit .fl input,.detail.edit .fl select{pointer-events:auto;background:var(--field)}
.da{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.ib{width:34px;height:34px;border:0;border-radius:50%;background:var(--field);color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--primary);color:#fff}
.ib.dl2{color:#f04452}
.secf{margin-bottom:0}
.sp{text-align:center}
.sr{display:flex;gap:14px;text-align:left;font-size:14px;line-height:2;font-weight:400;color:var(--fg);font-variant-numeric:tabular-nums}
.sr span:first-child{width:36px;flex:none}
.sr.inc{font-size:16px;font-weight:700}
.sr.calc{border-bottom:1px solid var(--fg);padding-bottom:6px;margin-bottom:6px}
.sp .mo{position:static}
.sdiv{margin:22px -16px 0;padding:20px 16px 0;border-top:1px solid var(--line)}
.sp b{display:block;margin-top:0;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sp .dl{margin-top:8px;line-height:1.6}
.sk{margin-top:18px}
.sk svg{width:100%;display:block;overflow:visible;touch-action:pan-y}
.sn{cursor:pointer}
.t-rest{--pc:var(--mute)}
</style>
</head>
<body>
<header><div class="hin"><span class="ava" id="ava"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg></span><h1 id="nm" spellcheck="false">사용자</h1></div></header>
<main>
<div class="view on" id="v-0">
  <div class="card chart-card"><div class="chart" id="chart">
    <svg viewBox="0 0 200 200" id="svg"></svg>
    <div class="center"><div class="mo"><button id="mp" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="mlabel"></span><button id="mn" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div><b id="total">₩0</b></div>
  </div>
  <div class="dl" id="delta"></div></div>
  <div class="card list" id="list"></div>
</div>
<div class="view" id="v-1">
  <div class="card chart-card sp">
    <div class="mo"><button id="imp" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="imlabel"></span><button id="imn" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="sk"><svg id="isvg" viewBox="0 0 360 1"></svg></div>
    <div class="sdiv" id="idelta"></div>
  </div>
  <div class="card list" id="ilist"></div>
</div>
</main>
<div class="dock"><nav id="nav"><i class="ind" id="ind"></i>
  <button class="on" data-i="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg><span>자산</span></button>
  <button data-i="1"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>통계</span></button>
</nav><button class="add" id="add" aria-label="추가"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></button></div>
<div id="tip"></div>
<div class="ov" id="ov2"><form class="modal" id="iform" autocomplete="off">
  <h2 id="imt">내역 추가</h2>
  <div class="seg-t" id="ktypes"><button type="button" data-k="in" class="on">소득</button><button type="button" data-k="out">지출</button></div>
  <label class="f"><input id="iname" placeholder="내역명" required maxlength="30"></label>
  <label class="f"><input id="iamt" placeholder="금액" inputmode="numeric" required></label>
  <label class="f"><select id="iacct" required></select></label>
  <div class="btns">
    <button type="button" class="del hide" id="idel">삭제</button>
    <button type="button" id="icancel">취소</button>
    <button type="submit" class="ok">저장</button>
  </div>
</form></div>
<div class="ov" id="ov"><form class="modal" id="form" autocomplete="off">
  <h2 id="mt">종목 추가</h2>
  <div class="seg-t" id="types"></div>
  <label class="f"><input id="name" placeholder="계좌명" required maxlength="30"></label>
  <div class="amt" id="amtrow">
    <select id="cur" class="hide"></select>
    <input id="amount" placeholder="금액" inputmode="decimal">
  </div>
  <div class="secf hide" id="secf">
    <label class="f"><input id="ticker" placeholder="종목" maxlength="30"></label>
    <div class="amt f"><select id="scur"><option value="KRW">원</option><option value="USD">달러</option></select><input id="price" placeholder="평단가" inputmode="decimal"></div>
    <label class="f"><input id="qty" placeholder="수량" inputmode="decimal"></label>
  </div>
  <div class="btns">
    <button type="button" class="del hide" id="del">삭제</button>
    <button type="button" id="cancel">취소</button>
    <button type="submit" class="ok">저장</button>
  </div>
</form></div>
<script>
const TYPES={cash:'입출금',fx:'외화',save:'예적금',sec:'증권'};
const CURS={USD:'$',JPY:'¥',CNY:'CN¥'};
const COLORS={cash:'--c-cash',fx:'--c-fx',save:'--c-save',in:'--c-in',out:'--c-out',sec:'--c-sec'};
const LBL={cash:'입출금',fx:'외화',save:'예적금',in:'소득',out:'지출',sec:'증권',rest:'잔액'};
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('assets',[]);
let flows=ls.get('flows',[]); // {id,kind:'in'|'out',name,amount,month:'YYYY-MM',monthly?}
let mo=0;
let openId=null,editing=false;
let rates=ls.get('rates',{USD:0,JPY:0,CNY:0}); // KRW per 1 unit
let editId=null,curType='cash';
const fmt=(n,d=0)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtN=(n,d)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});
const krw=i=>i.type==='sec'?i.price*i.qty*(i.cur==='USD'?(rates.USD||0):1):i.type==='fx'?i.amount*(rates[i.cur]||0):i.amount;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=i=>i.type==='sec'?'₩'+fmt(Math.round(krw(i))):i.type==='out'?'-₩'+fmt(i.amount):i.type==='in'?'+₩'+fmt(i.amount):i.type==='fx'?CURS[i.cur]+fmt(i.amount,i.cur==='JPY'?0:2):(i.amount<0?'-':'')+'₩'+fmt(Math.abs(i.amount));
const sub=i=>i.note?i.note:(i.type==='sec'?`${i.ticker} ${fmtN(i.qty,4)}주`:i.type==='fx'&&rates[i.cur]?'₩'+fmt(Math.round(krw(i))):'');
const pill=t=>`<span class="pill t-${t}">${LBL[t]}</span>`;

// colors: per-type hue, varying lightness per account
function shade(i,idx){
  const base=css(COLORS[i.type]);
  const same=items.filter(x=>x.type===i.type);
  const k=Math.max(0,same.findIndex(x=>x.id===i.id));
  return `color-mix(in srgb, ${base} ${Math.max(45,100-k*14)}%, ${css('--bg')})`;
}

function arc(a0,a1,r){
  const p=a=>[100+r*Math.sin(a),100-r*Math.cos(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;
}

const baseM=()=>{const n=new Date();return n.getFullYear()*12+n.getMonth()};
const keyOf=M=>Math.floor(M/12)+'-'+String(M%12+1).padStart(2,'0');
function viewFlows(m=mo){
  if(m<0)return [];
  const b=baseM(),M=b+m,out=[];
  flows.forEach(f=>{
    const [y,m]=String(f.month).split('-').map(Number);if(!y||!m)return;
    const st=y*12+m-1;
    const n=f.monthly?Math.max(0,M-Math.max(st,b)+1):(st>=b&&st<=M?1:0);
    if(n>0)out.push({fid:f.id,kind:f.kind,name:f.name,amount:f.amount*n,acct:f.acct});
  });
  return out;
}
const monthParts=()=>{const M=baseM()+mo;return [Math.floor(M/12),M%12+1]};
let poolA=[],poolI=[];
function ring(svg,entries){
  const g=entries.reduce((s,i)=>s+krw(i),0);
  let h='<circle class="ring-empty" cx="100" cy="100" r="78"/>';
  if(g>0){

function build(m){
  const fl=viewFlows(m),add={},orphan=[],exp=[];let orphanOut=0;
  const ok=id=>items.some(i=>i.id===id&&i.type!=='sec');
  const nm=id=>(items.find(i=>i.id===id)||{}).name||'';

let imo=0;
function sankey(svg,ins,outs,I,E){
  const T=Math.max(I,E);
  if(T<=0){svg.setAttribute('viewBox','0 0 360 1');svg.innerHTML='';return}
  const L=ins.map(x=>({...x})),R=outs.map(x=>({...x}));
  if(E>I)L.push({id:'def',type:'rest',name:'부족',amount:E-I});
  if(I>E)R.push({id:'rest',type:'rest',name:'잔액',amount:I-E});
  const GAP=14,MINH=26,PAD=4,n=Math.max(L.length,R.length),H=Math.max(220,n*64);
  const colH=(c,k)=>c.reduce((s,x)=>s+Math.max(x.amount*k,MINH),0)+GAP*(c.length-1);
  let k=(H-GAP*(n-1))/T;
  for(let t=0;t<40&&Math.max(colH(L,k),colH(R,k))>H;t++)k*=.94;
  const place=c=>{let y=PAD+(H-colH(c,k))/2;c.forEach(x=>{x.h=Math.max(x.amount*k,MINH);x.y=y;y+=x.h+GAP})};
  place(L);place(R);
  const mh=Math.max(T*k,MINH),M={id:'inc',type:'in',name:'소득',amount:I,y:PAD+(H-mh)/2,h:mh};
  const col=(x,i)=>x.type==='in'?`color-mix(in srgb,var(--c-in) ${Math.max(50,100-i*12)}%,var(--bg))`:x.type==='out'?`color-mix(in srgb,var(--c-out) ${Math.max(50,100-i*12)}%,var(--bg))`:'var(--mute)';
  const XL=64,XM=176,XR=282,BW=8;
  const rib=(x0,y0,y1,x1,z0,z1,c)=>{const m=(x0+x1)/2;return `<path d="M${x0} ${y0}C${m} ${y0} ${m} ${z0} ${x1} ${z0}L${x1} ${z1}C${m} ${z1} ${m} ${y1} ${x0} ${y1}Z" style="fill:${c};opacity:.22"/>`};
  let links='',nodes='',mo=0;
  L.forEach((l,i)=>{const z0=M.y+mo,z1=z0+l.amount/T*M.h;mo+=l.amount/T*M.h;links+=rib(XL+BW,l.y,l.y+l.h,XM,z0,z1,col(l,i))});
  let mo2=0;
  R.forEach((r,i)=>{const y0=M.y+mo2,y1=y0+r.amount/T*M.h;mo2+=r.amount/T*M.h;links+=rib(XM+BW,y0,y1,XR,r.y,r.y+r.h,col(r,i))});
  const cut=s=>s.length>5?s.slice(0,4)+'…':s;
  const node=(nd,x,i,anchor,tx)=>{
    const cy=nd.y+nd.h/2;
    nodes+=`<rect class="sn" data-id="${nd.id}" x="${x}" y="${nd.y}" width="${BW}" height="${nd.h}" style="fill:${col(nd,i)}"/>`
      +`<text class="sn" data-id="${nd.id}" x="${tx}" y="${cy-2}" text-anchor="${anchor}" style="font-size:12px;font-weight:600;fill:var(--fg)">${esc(cut(nd.name))}</text>`
      +`<text class="sn" data-id="${nd.id}" x="${tx}" y="${cy+12}" text-anchor="${anchor}" style="font-size:11px;fill:var(--mute)">₩${fmt(nd.amount)}</text>`
      +`<rect class="sn" data-id="${nd.id}" x="${x-10}" y="${nd.y-4}" width="${BW+20}" height="${nd.h+8}" style="fill:transparent"/>`;
  };
  L.forEach((nd,i)=>node(nd,XL,i,'end',XL-8));
  R.forEach((nd,i)=>node(nd,XR,i,'start',XR+BW+8));
  nodes+=`<rect class="sn" data-id="inc" x="${XM}" y="${M.y}" width="${BW}" height="${M.h}" style="fill:${col(M,0)}"/>`
    +`<rect class="sn" data-id="inc" x="${XM-12}" y="${M.y}" width="${BW+24}" height="${M.h}" style="fill:transparent"/>`;
  svg.setAttribute('viewBox',`0 0 360 ${H+PAD+10}`);
  svg.innerHTML=links+nodes;
}

function fmtAmt(raw,dec=decOk()){
  let v=raw.replace(/[^\d.]/g,'');
  const dot=dec&&v.includes('.');
  const p=v.split('.');
  let int=p[0].replace(/^0+(?=\d)/,'');
  const out=int.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dot?out+'.'+p.slice(1).join('').slice(0,2):out;
}
function reAmt(el=amtEl,dec=decOk()){
  const pos=el.selectionStart??el.value.length;
  const n=el.value.slice(0,pos).replace(/[^\d.]/g,'').length;
  el.value=fmtAmt(el.value,dec);
  let c=0,k=0;
  for(;k<el.value.length&&c<n;k++)if(/[\d.]/.test(el.value[k]))c++;
  try{el.setSelectionRange(k,k)}catch{}
}

function startDrag(){
  if(openId){openId=null;editing=false;render()}
  const row=list.querySelector(`.row[data-id="${st.id}"]`);if(!row){st=null;return}row.classList.remove('press');
  const all=rows(),rects=all.map(x=>x.getBoundingClientRect()),d=all.indexOf(row);
  navigator.vibrate&&navigator.vibrate(10);
  dr={row,all,d,t:d,h:rects[d].height,mid:rects.map(r=>r.top+r.height/2),grab:st.y-rects[d].top,top0:rects[d].top,sy:scrollY};
  row.classList.add('drag');hideTip();
}
function moveDrag(y){
  const ds=scrollY-dr.sy;
  dr.row.style.transform=`translateY(${y-dr.grab-dr.top0-ds}px) scale(1.02)`;
  const c=y-dr.grab+dr.h/2-ds;
  let t=0;dr.mid.forEach((m,k)=>{if(k!==dr.d&&m<c)t++});
  dr.t=t;
  dr.all.forEach((x,k)=>{
    if(k===dr.d)return;
    let o=0;
    if(t>dr.d&&k>dr.d&&k<=t)o=-dr.h;
    if(t<dr.d&&k>=t&&k<dr.d)o=dr.h;
    x.style.transform=o?`translateY(${o}px)`:'';
  });
}
document.addEventListener('pointermove',e=>{
  if(dr){moveDrag(e.clientY);return}
  if(st&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){endPress();st=null}
});
document.addEventListener('pointerup',()=>{
  if(dr){
    const ids=dr.all.map(x=>x.dataset.id),mv=ids.splice(dr.d,1)[0];ids.splice(dr.t,0,mv);
    items=ids.map(id=>items.find(v=>v.id===id));
    dr=null;st=null;save();return;
  }
  if(st){const row=st.row;endPress();st=null;if(!$('#ov').classList.contains('open')){const id=row.dataset.id;openId=openId===id?null:id;editing=false;render()}}
});
document.addEventListener('pointercancel',()=>{endPress();if(!dr)st=null});
document.addEventListener('touchmove',e=>{if(dr)e.preventDefault()},{passive:false});
list.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// rates (free, no key)
async function loadRates(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/KRW');
    const j=await r.json();
    if(j.rates){for(const c of Object.keys(CURS))if(j.rates[c])rates[c]=1/j.rates[c]}
  }catch{
    try{
      const r=await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,CNY');
      const j=await r.json();
      for(const c of Object.keys(CURS))if(j.rates&&j.rates[c])rates[c]=1/j.rates[c];
    }catch{}
  }
  ls.set('rates',rates);if(!dr)render(editing);
}

async function pull(){

    const d=await rpc('moakr_get',{k:SK});
    if(pushT||dr||editing||$('#ov').classList.contains('open')||$('#ov2').classList.contains('open')||nmEl.isContentEditable)return;

      if(JSON.stringify(d.items)!==JSON.stringify(items)){items=d.items;ls.set('assets',items);render()}
      if(Array.isArray(d.flows)&&JSON.stringify(d.flows)!==JSON.stringify(flows)){flows=d.flows;ls.set('flows',flows);render()}
      if(d.name&&d.name!==ls.get('name','사용자')){ls.set('name',d.name);nmEl.textContent=d.name}
    }else push();
  }catch{}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
