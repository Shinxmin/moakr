<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>자산</title>
<style>
:root{
  --bg:#fff;--card:#fff;--fg:#191f28;--sub:#4e5968;--mute:#8b95a1;--line:#e5e8eb;--field:#f2f4f6;--primary:#3182f6;
  --glass:rgba(255,255,255,.72);--glass-b:rgba(255,255,255,.6);--shadow:0 8px 32px rgba(0,0,0,.14);
  --r:16px;--ico:38px;
  --c-cash:#3182f6;--c-fx:#f59f00;--c-save:#00b386;--c-in:#8b5cf6;--c-out:#f04452;--c-sec:#ec4899;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17171c;--card:#17171c;--fg:#f9fafb;--sub:#c3c8d1;--mute:#8b95a1;--line:#2c2c35;--field:#2c2c35;--primary:#4593fc;
  --glass:rgba(40,40,48,.7);--glass-b:rgba(255,255,255,.08);--shadow:0 8px 32px rgba(0,0,0,.5);
  --c-cash:#4593fc;--c-fx:#ffb724;--c-save:#1fc99b;--c-in:#a78bfa;--c-out:#ff6b78;--c-sec:#f472b6}
  header{background:rgba(23,23,28,.55)}
  nav{background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06))!important;border-color:rgba(255,255,255,.16)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 8px 28px rgba(0,0,0,.5)!important}
  nav .ind{background:rgba(255,255,255,.12)!important}
  .add{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.08))!important;border-color:rgba(255,255,255,.18)!important;box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.4)!important}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,[contenteditable]{-webkit-user-select:text;user-select:text}
html,body{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:none}
::-webkit-scrollbar{display:none;width:0;height:0}
html.nos,html.nos body{overflow:hidden;height:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard",-apple-system,"Noto Sans KR",system-ui,sans-serif;letter-spacing:-.01em}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8)}
.hin{max-width:520px;margin:0 auto;height:calc(66px + env(safe-area-inset-top));padding:calc(16px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
h1{cursor:text;padding:3px 0;outline:none;min-width:24px;font-size:17px;line-height:1;font-weight:700;letter-spacing:-.02em;margin:0}
.add{width:var(--ico);min-width:var(--ico);height:var(--ico);margin-left:auto;border-radius:50%;border:0;padding:0;flex:none;background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 1px 1px #fff,inset 0 -2px 4px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.add svg{display:block;width:16px;height:16px}
.add:active{transform:scale(.92)}
.ava{width:var(--ico);min-width:var(--ico);height:var(--ico);border-radius:50%;background:color-mix(in srgb,var(--mute) 22%,var(--bg));color:var(--mute);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:none}
.ava svg{width:47px;height:47px;flex:none;display:block;margin-bottom:-6px}
main{max-width:520px;margin:0 auto;padding:calc(68px + env(safe-area-inset-top)) 16px calc(132px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r)}
.chart-card{padding:20px 16px 28px;margin-bottom:0}
.chart{position:relative;width:min(100%,236px);margin:0 auto;aspect-ratio:1}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.seg{fill:none;stroke-width:20;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.seg.on{stroke-width:25}
.dim .seg:not(.on){opacity:.3}
.ring-empty{fill:none;stroke:var(--line);stroke-width:20}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none}
.mo{position:absolute;left:0;right:0;bottom:calc(50% + 17px);display:flex;align-items:center;justify-content:center;gap:0;font-size:13px;font-weight:600;color:var(--sub);pointer-events:auto}
.mo span{line-height:1}
.nb{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.nb.l{left:-46px}.nb.r{right:-46px}
.nb:active{background:var(--field)}
.nb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mo button{width:24px;height:24px;border:0;padding:0;border-radius:50%;background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mo button:active{background:var(--field)}
.mo svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.seg.dash{stroke-dasharray:4 3}
.t-sec{--pc:var(--c-sec)}
.t-in{--pc:var(--c-in)}.t-out{--pc:var(--c-out)}
.row.flow{cursor:default}

.center b{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;flex:none;min-width:40px;text-align:center;font-size:10px;line-height:1;padding:4px 7px;border-radius:999px;font-weight:600;color:#fff;background:var(--pc)}
.t-cash{--pc:var(--c-cash)}.t-fx{--pc:var(--c-fx)}.t-save{--pc:var(--c-save)}
#tip{position:fixed;z-index:20;pointer-events:none;min-width:200px;max-width:300px;padding:12px 14px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip .h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
#tip .n{font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip .a{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
#tip .k{display:block;white-space:pre-line;font-size:10px;font-weight:400;color:var(--mute);margin:3px 0 0;line-height:1.5;font-variant-numeric:tabular-nums}
.list{position:relative;border-radius:0;border-top:1px solid var(--line);padding:10px 6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:8px;padding:18px 10px;border-radius:12px;cursor:pointer;touch-action:pan-y;transition:background .15s,transform .2s}
.row.press{background:var(--field)}
.row.drag{position:relative;z-index:5;background:var(--card);box-shadow:var(--shadow);transition:none;cursor:grabbing}
.row .nm{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{position:relative;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.row .r .ss{position:absolute;right:0;top:100%;white-space:nowrap}
.row.sl1{padding-bottom:36px}
.row.sl2{padding-bottom:52px}
.row .r b{display:block;font-size:13px;font-weight:700}
.row .r small{display:block;font-size:10px;color:var(--mute);margin-top:2px}
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ov.open{display:flex;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{width:100%;max-width:320px;border-radius:24px;padding:20px 16px 16px;background:var(--card);box-shadow:var(--shadow);animation:u .2s cubic-bezier(.2,.8,.2,1)}
@keyframes u{from{transform:translateY(16px);opacity:0}}
.modal h2{margin:0 0 14px 4px;font-size:16px;font-weight:700;letter-spacing:-.03em}
.seg-t{display:flex;gap:4px;margin-bottom:12px;padding:3px;border-radius:14px;background:var(--field)}
.seg-t button{flex:1;padding:8px 0;border-radius:11px;border:0;background:transparent;color:var(--mute);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.seg-t button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid transparent;background:var(--field);color:var(--fg);font:inherit;font-size:16px;font-weight:500;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--mute);font-weight:400}
input:focus,select:focus{border-color:var(--primary)}
.f{display:block;margin-bottom:8px}
.amt{display:flex;gap:8px}.amt select{width:80px;flex:none;text-align:center}
.btns{display:flex;gap:6px;margin-top:14px}
.btns button{flex:1;padding:13px 0;border-radius:14px;border:0;background:var(--field);color:var(--sub);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.btns button:active{transform:scale(.97)}
.btns .ok{background:var(--primary);color:#fff;flex:1.6}
.btns .del{background:color-mix(in srgb,#f04452 12%,transparent);color:#f04452;flex:.7}
.hide{display:none!important}
.view{display:none}
.view.on{display:block;animation:vr .32s cubic-bezier(.2,.8,.2,1)}
.view.on.fl{animation-name:vl}
@keyframes vr{from{opacity:0;transform:translateX(28px)}}
@keyframes vl{from{opacity:0;transform:translateX(-28px)}}
.dock{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(calc(100% - 80px),300px);display:flex;align-items:flex-end;gap:10px}
.dock .add{width:52px;min-width:52px;height:52px;margin:0}
.dock .add svg{width:20px;height:20px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dock.exp .add svg{transform:rotate(45deg)}
nav.exp{height:var(--xh,52px);border-radius:28px}
nav.exp .tabs{opacity:0;pointer-events:none}
.xf{position:absolute;left:0;right:0;bottom:0;padding:12px;opacity:0;pointer-events:none;transition:opacity .15s}
nav.exp.m-flow #iform,nav.exp.m-name #nform{opacity:1;pointer-events:auto;transition:opacity .25s .12s}
.xr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.xr:last-child{margin-bottom:0}
.xr.r{justify-content:flex-end}
.xr input{flex:1;min-width:0}
.xf .f{margin:0 0 8px}
.xf input{padding:11px 12px;border-radius:12px}
.xf input:focus{border-color:var(--line)}
.xf .seg-t{flex:none;width:72%;margin:0;padding:3px;border-radius:12px}
.xf .seg-t button{padding:7px 0;font-size:13px;border-radius:9px}
.xf #atypes{flex:1;width:auto}
.xr select{flex:none;width:68px;padding:11px 6px;border-radius:12px;text-align:center;text-align-last:center}
.xok:disabled{opacity:.35;cursor:default}
.xi{flex:none;margin-left:auto;width:36px;height:36px;border:0;border-radius:12px;background:var(--field);color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.xi svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.xok{flex:none;height:42px;padding:0 16px;border:0;border-radius:12px;background:var(--sub);color:var(--bg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.xok:active,.xi:active{transform:scale(.96)}
#scrim{display:none;position:fixed;inset:0;z-index:14;background:transparent}
#scrim.on{display:block}
nav{position:relative;flex:1;height:52px;border-radius:26px;transition:height .38s cubic-bezier(.2,.8,.2,1),border-radius .38s;
  background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.3));border:1px solid rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(22px) saturate(1.9);backdrop-filter:blur(22px) saturate(1.9);
  box-shadow:inset 0 1px 1px #fff,inset 0 -2px 6px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.14),0 1px 4px rgba(0,0,0,.08)}
nav .tabs{position:absolute;inset:0;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);transition:opacity .18s}
nav .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:22px;background:rgba(0,0,0,.06);box-shadow:inset 0 1px 1px rgba(255,255,255,.8);transition:transform .35s cubic-bezier(.3,1.2,.4,1)}
nav .tabs button{position:relative;border:0;background:transparent;color:var(--mute);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0;transition:color .2s}
nav .tabs button.on{color:var(--fg)}
nav .tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .tabs span{font-size:10px;font-weight:600;line-height:1}
.add.off{visibility:hidden;pointer-events:none}
.row{flex-wrap:wrap}
.detail{flex:0 0 100%;order:5;margin-top:12px;padding-top:6px;border-top:1px solid var(--line);animation:dx .22s ease}
@keyframes dx{from{opacity:0;transform:translateY(-6px)}}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px}
.fl .k{color:var(--mute);flex:none;width:56px}
.fl input,.fl select{width:auto;flex:1;min-width:0;text-align:right;text-align-last:right;padding:8px 10px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:inherit;font-size:16px;font-weight:500;pointer-events:none;-webkit-appearance:none;appearance:none;opacity:1}
.detail.edit .fl input,.detail.edit .fl select{pointer-events:auto;background:var(--field)}
.da{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.ib{width:34px;height:34px;border:0;border-radius:50%;background:var(--field);color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--primary);color:#fff}
.ib.dl2{color:#f04452}
.secf{margin-bottom:0}
#v-2{min-height:max(520px,calc(100dvh - 200px - env(safe-area-inset-top) - env(safe-area-inset-bottom)))}
#v-2.on{display:flex;flex-direction:column}
.sz{flex:1.15 1 0;min-height:200px;padding:6px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.sz svg{width:92%;height:100%;display:block;overflow:visible}
.emp{display:none;font-size:14px;color:var(--mute)}
.sz.empty svg{display:none}
.sz.empty .emp{display:block}
.xf #ktypes{flex:none;width:50%;margin:0}
.cemp{padding:60px 0;text-align:center;font-size:14px;color:var(--mute)}
.stn{padding:14px 0;text-align:center}
.chart .mo{color:var(--fg)}
.chart .mo button{color:var(--fg)}
.stn .mo{position:static;font-size:14px;color:var(--fg)}
.stn .mo button{color:var(--fg)}
.stc{flex:1 1 0;min-height:200px;padding:8px 16px calc(92px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center}
.stc svg{width:78%;max-width:340px;display:block}
</style>
</head>
<body>
<header><div class="hin"><span class="ava" id="ava"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="9" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7z"/></svg></span><h1 id="nm" spellcheck="false">사용자</h1></div></header>
<main>
<div class="view on" id="v-0">
  <div class="card chart-card"><div class="chart" id="chart">
    <svg viewBox="0 0 200 200" id="svg"></svg>
    <div class="center"><div class="mo"><button id="mp" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="mlabel"></span><button id="mn" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div><b id="total">₩0</b></div>
  </div></div>
  <div class="card list" id="list"></div>
</div>
<div class="view" id="v-1">
  <div class="stn"><div class="mo"><button id="rmp" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="rmlabel"></span><button id="rmn" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
  <div class="card list" id="rlist"></div>
</div>
<div class="view" id="v-2">
  <div class="stn"><div class="mo"><button id="smp" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="smlabel"></span><button id="smn" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div></div>
  <div class="sz" id="sk"><svg id="isvg" viewBox="0 0 360 1"></svg><div class="emp">데이터가 없습니다</div></div>
  <div class="stc"><svg id="tsvg" viewBox="0 0 200 160"></svg></div>
</div>
</main>
<div id="scrim"></div>
<div class="dock" id="dock"><nav id="nav"><div class="tabs" id="tabs"><i class="ind" id="ind"></i>
  <button class="on" data-i="0"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg><span>자산</span></button>
  <button data-i="1"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h4"/></svg><span>기록</span></button>
  <button data-i="2"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg><span>통계</span></button>
</div><form class="xf" id="nform" autocomplete="off"><div class="xr"><input id="nmin" placeholder="이름" maxlength="20" required><button type="submit" class="xok">저장</button></div></form>
<form class="xf" id="iform" autocomplete="off">
  <div class="xr"><div class="seg-t" id="atypes"><button type="button" data-a="cash" class="on">통장</button><button type="button" data-a="save">저축</button><button type="button" data-a="fx">외화</button><button type="button" data-a="sec">증권</button></div><div class="seg-t hide" id="ktypes"><button type="button" data-k="in" class="on">소득</button><button type="button" data-k="out">지출</button></div><button type="button" class="xi hide" id="idel" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button></div>
  <div id="xbody"></div>
</form></nav><button class="add" id="add" aria-label="추가"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></button></div>
<div id="tip"></div>
<div class="ov" id="ov"><form class="modal" id="form" autocomplete="off">
  <h2 id="mt">종목 추가</h2>
  <div class="seg-t" id="types"></div>
  <label class="f"><input id="name" placeholder="계좌명" required maxlength="30"></label>
  <div class="amt" id="amtrow">
    <select id="cur" class="hide"></select>
    <input id="amount" placeholder="금액" inputmode="decimal">
  </div>
  <div class="secf hide" id="secf">
    <label class="f"><input id="ticker" placeholder="종목" maxlength="30"></label>
    <div class="amt f"><select id="scur"><option value="KRW">원</option><option value="USD">달러</option></select><input id="price" placeholder="평단가" inputmode="decimal"></div>
    <label class="f"><input id="qty" placeholder="수량" inputmode="decimal"></label>
  </div>
  <div class="btns">
    <button type="button" class="del hide" id="del">삭제</button>
    <button type="button" id="cancel">취소</button>
    <button type="submit" class="ok">저장</button>
  </div>
</form></div>
<script>
const TYPES={cash:'입출금',fx:'외화',save:'예적금',sec:'증권'};
const CURS={USD:'$',JPY:'¥',CNY:'CN¥'};
const COLORS={cash:'--c-cash',fx:'--c-fx',save:'--c-save',in:'--c-in',out:'--c-out',sec:'--c-sec'};
const LBL={cash:'통장',fx:'외화',save:'저축',in:'소득',out:'지출',sec:'증권',rest:'잔액'};
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('assets',[]);
function migSec(o){
  if(o&&o.type==='sec'&&(o.price!==undefined||o.ticker!==undefined||o.qty!==undefined)){
    const v=(o.price||0)*(o.qty||0);
    if(o.cur==='USD'){o.usd=v;o.krw=0}else{o.usd=0;o.krw=v}
    ['price','qty','ticker','cur'].forEach(k=>{o[k]=undefined});
    JSON.parse(JSON.stringify(o));
  }
  return o;
}
function normItems(){
  items=items.map(it=>{migSec(it);if(it.hist)it.hist.forEach(h=>migSec(h.f));return JSON.parse(JSON.stringify(it))});
}
normItems();

const fmt=(n,d=0)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtN=(n,d)=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});
const krw=i=>i.type==='sec'?(i.krw||0)+(i.usd||0)*(rates.USD||0):i.type==='fx'?i.amount*(rates[i.cur]||0):i.amount;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=i=>i.type==='sec'?'₩'+fmt(Math.round(krw(i))):i.type==='out'||i.type==='in'?'₩'+fmt(i.amount):i.type==='fx'?'₩'+fmt(Math.round(krw(i))):(i.amount<0?'-':'')+'₩'+fmt(Math.abs(i.amount));
const sub=i=>i.note?i.note:(i.type==='sec'?`USD ${fmtN(i.usd||0,2)}\nKRW ${fmt(Math.round(i.krw||0))}`:i.type==='fx'?`${i.cur} ${fmtN(i.amount,i.cur==='JPY'?0:2)}`:'');
const subHtml=i=>sub(i)?sub(i).split('\n').map(t=>`<small>${esc(t)}</small>`).join(''):'';
const slCls=i=>{const n=sub(i)?sub(i).split('\n').length:0;return n?' sl'+n:''};
const pill=t=>`<span class="pill t-${t}">${LBL[t]}</span>`;

// colors: per-type hue, varying lightness per account
function shade(i,idx){
  const base=css(COLORS[i.type]);
  const same=items.filter(x=>x.type===i.type);
  const k=Math.max(0,same.findIndex(x=>x.id===i.id));
  return `color-mix(in srgb, ${base} ${Math.max(45,100-k*14)}%, ${css('--bg')})`;
}

function arc(a0,a1,r){
  const p=a=>[100+r*Math.sin(a),100-r*Math.cos(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;
}

const baseM=()=>{const n=new Date();return n.getFullYear()*12+n.getMonth()};
const keyOf=M=>Math.floor(M/12)+'-'+String(M%12+1).padStart(2,'0');
const monthParts=()=>{const M=baseM()+mo;return [Math.floor(M/12),M%12+1]};
let poolA=[];
function ring(svg,entries){
  const g=entries.reduce((s,i)=>s+krw(i),0);
  let h='<circle class="ring-empty" cx="100" cy="100" r="78"/>';
  if(g>0){
    let a=0;const gap=entries.length>1?0.025:0;
    entries.forEach(i=>{
      const v=krw(i);if(v<=0)return;
      const span=v/g*Math.PI*2;
      const s=a+gap/2,e=Math.min(a+span-gap/2,a+Math.PI*2-0.0001);
      h+=`<path class="seg" data-id="${i.id}" d="${arc(s,Math.max(e,s+0.001),78)}" stroke="${shade(i)}"/>`;
      a+=span;
    });
  }
  svg.innerHTML=h;
}
const rowHtml=i=>`${pill(i.type)}<span class="nm">${esc(i.name)}</span>
    <div class="r"><b>${main(i)}</b><div class="ss">${subHtml(i)}</div></div>`;

const ICON_EDIT='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_DEL='<svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg>';
function detailHtml(i){
  const ro=editing?'':' readonly';
  const tx=(k,key,v)=>`<label class="fl"><span class="k">${k}</span><input data-f="${key}" value="${esc(String(v))}"${ro} maxlength="30"></label>`;
  const nu=(k,key,v,d)=>`<label class="fl"><span class="k">${k}</span><input data-f="${key}" data-d="${d}" inputmode="decimal" value="${fmtN(v,d)}"${ro}></label>`;
  const sl=(k,key,v,opts)=>`<label class="fl"><span class="k">${k}</span><select data-f="${key}"${editing?'':' disabled'}>${opts.map(([a,b])=>`<option value="${a}"${a===v?' selected':''}>${b}</option>`).join('')}</select></label>`;
  let h='';
  if(i.type==='sec'){
    h=tx('계좌명','name',i.name)+tx('종목','ticker',i.ticker)+nu('평단가','price',i.price,2)+nu('수량','qty',i.qty,4)+sl('통화','cur',i.cur,[['KRW','원'],['USD','달러']]);
  }else if(i.type==='fx'){
    h=tx('계좌명','name',i.name)+sl('통화','cur',i.cur,Object.keys(CURS).map(c=>[c,c]))+nu('금액','amount',i.amount,i.cur==='JPY'?0:2);
  }else h=tx('계좌명','name',i.name)+nu('금액','amount',i.amount,0);
  return `<div class="detail${editing?' edit':''}">${h}<div class="da"><button type="button" class="ib${editing?' on':''}" data-act="edit" aria-label="수정">${ICON_EDIT}</button><button type="button" class="ib dl2" data-act="del" aria-label="삭제">${ICON_DEL}</button></div></div>`;
}
const FIELDS=['type','name','amount','cur','usd','krw'];
const pickF=o=>{const f={};FIELDS.forEach(k=>{if(o[k]!==undefined)f[k]=o[k]});return f};
// asset state at month key K (assets persist until deleted; edits apply from their month on)
function snapAt(it,K){
  if(it.month&&K<it.month)return null;
  if(it.end&&K>=it.end)return null;
  for(const h of it.hist||[])if(K>=h.from&&K<h.to)return {id:it.id,month:it.month,...h.f};
  return {id:it.id,month:it.month,...pickF(it)};
}
const itemsAt=m=>{const K=keyOf(baseM()+m);return items.map(i=>snapAt(i,K)).filter(Boolean)};
function editAssetFrom(it,f,Y){
  const start=it.from||it.month||'0000-00',old=it.hist||[];
  const hist=old.filter(h=>h.from<Y).map(h=>h.to>Y?{from:h.from,to:Y,f:h.f}:h);
  const covered=old.some(h=>h.from<Y&&h.to>Y);
  if(!covered&&start<Y)hist.push({from:start,to:Y,f:pickF(it)});
  FIELDS.forEach(k=>delete it[k]);
  Object.assign(it,pickF(f));
  it.from=Y;
  if(hist.length)it.hist=hist;else delete it.hist;
}
function deleteAssetAt(it,Y){
  if(it.month&&Y<=it.month)items=items.filter(v=>v.id!==it.id);
  else it.end=Y;
}
const mIdx=k=>{const [y,mm]=String(k).split('-').map(Number);return y*12+mm-1};
function build(m){
  const vi=itemsAt(m);
  return {vi,net:vi.reduce((s,i)=>s+krw(i),0)};
}
function render(keep=false){
  renderRecords();renderStats();
  const {vi,net}=build(mo);
  $('#total').textContent=(net<0?'-':'')+'₩'+fmt(Math.abs(Math.round(net)));
  {const [y,m]=monthParts();$('#mlabel').textContent=`${y}년 ${m}월`}
  ring($('#svg'),vi);
  poolA=vi;
  if(keep){
    vi.forEach(i=>{const row=$('#list').querySelector(`.row[data-id="${i.id}"]`);if(!row)return;
      row.querySelector('.nm').textContent=i.name;row.querySelector('.r').innerHTML=`<b>${main(i)}</b>${subHtml(i)}`});
  }else
  $('#list').innerHTML=vi.map(i=>`<div class="row${i.id===openId?' open':''}${slCls(i)}" data-id="${i.id}">${rowHtml(i)}${i.id===openId?detailHtml(items.find(x=>x.id===i.id)||i):''}</div>`).join('');
}

// tooltip
const tip=$('#tip');
function showTip(id,x,y,pool,svg){
  const i=pool.find(v=>v.id===id);if(!i)return;
  tip.innerHTML=`<div class="h">${pill(i.type)}<span class="n">${esc(i.name)}</span></div><div class="a">${main(i)}${sub(i)?`<span class="k">${esc(sub(i))}</span>`:''}</div>`;
  tip.classList.add('show');
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  let l=x+16,t=y-hh-14;
  if(l+w>innerWidth-10)l=x-w-16;
  if(l<10)l=10;
  if(t<10)t=y+18;
  tip.style.left=l+'px';tip.style.top=t+'px';
  svg.parentElement.classList.add('dim');
  svg.querySelectorAll('.seg').forEach(s=>s.classList.toggle('on',s.dataset.id===id));
}
function hideTip(){tip.classList.remove('show');document.querySelectorAll('.chart').forEach(c=>c.classList.remove('dim'));document.querySelectorAll('.seg.on').forEach(s=>s.classList.remove('on'))}
function bindChart(svg,pool){
  const probe=e=>{
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(el&&el.classList&&(el.classList.contains('seg')||el.classList.contains('sn'))&&svg.contains(el))showTip(el.dataset.id,e.clientX,e.clientY,pool(),svg);else hideTip();
  };
  svg.addEventListener('pointermove',probe);
  svg.addEventListener('pointerdown',probe);
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});
}
bindChart($('#svg'),()=>poolA);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.chart svg,.sk svg'))hideTip()});

// amount input
const amtEl=$('#amount');
const decOk=()=>curType==='fx'&&$('#cur').value!=='JPY';
function fmtAmt(raw,dec=decOk()){
  let v=raw.replace(/[^\d.]/g,'');
  const dot=dec&&v.includes('.');
  const p=v.split('.');
  let int=p[0].replace(/^0+(?=\d)/,'');
  const out=int.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return dot?out+'.'+p.slice(1).join('').slice(0,2):out;
}
function reAmt(el=amtEl,dec=decOk()){
  const pos=el.selectionStart??el.value.length;
  const n=el.value.slice(0,pos).replace(/[^\d.]/g,'').length;
  el.value=fmtAmt(el.value,dec);
  let c=0,k=0;
  for(;k<el.value.length&&c<n;k++)if(/[\d.]/.test(el.value[k]))c++;
  try{el.setSelectionRange(k,k)}catch{}
}
amtEl.addEventListener('input',()=>reAmt());
$('#cur').addEventListener('change',()=>reAmt());
$('#price').addEventListener('input',()=>reAmt($('#price'),true));
$('#qty').addEventListener('input',()=>reAmt($('#qty'),true));

// stats (sankey + monthly asset trend) and 기록 (소득/지출 records, separate from assets)
let tab=0,smo=0,rmo=0;
const tabMo=()=>tab===0?mo:tab===1?rmo:smo;
const fmtMan=v=>{const m=Math.round(v/10000);return (m<0?'-':'')+fmt(Math.abs(m))+'만원'};
function sankey(svg,ins,outs,I,E){
  const T=Math.max(I,E);
  if(T<=0){svg.setAttribute('viewBox','0 0 360 1');svg.innerHTML='';return}
  const L=ins.map(x=>({...x})),R=outs.map(x=>({...x}));
  if(E>I)L.push({id:'def',type:'rest',name:'부족',amount:E-I});
  if(I>E)R.push({id:'rest',type:'rest',name:'잔액',amount:I-E});
  const GAP=14,MINH=26,PAD=4,n=Math.max(L.length,R.length),H=Math.max(220,n*64);
  const colH=(c,k)=>c.reduce((s,x)=>s+Math.max(x.amount*k,MINH),0)+GAP*(c.length-1);
  let k=(H-GAP*(n-1))/T;
  for(let t=0;t<40&&Math.max(colH(L,k),colH(R,k))>H;t++)k*=.94;
  const place=c=>{let y=PAD+(H-colH(c,k))/2;c.forEach(x=>{x.h=Math.max(x.amount*k,MINH);x.y=y;y+=x.h+GAP})};
  place(L);place(R);
  const mh=Math.max(T*k,MINH),M={id:'inc',type:'in',name:'소득',amount:I,y:PAD+(H-mh)/2,h:mh};
  const col=(x,i)=>x.type==='in'?`color-mix(in srgb,var(--c-in) ${Math.max(50,100-i*12)}%,var(--bg))`:x.type==='out'?`color-mix(in srgb,var(--c-out) ${Math.max(50,100-i*12)}%,var(--bg))`:'var(--mute)';
  const XL=64,XM=176,XR=282,BW=8;
  const rib=(x0,y0,y1,x1,z0,z1,c)=>{const m=(x0+x1)/2;return `<path d="M${x0} ${y0}C${m} ${y0} ${m} ${z0} ${x1} ${z0}L${x1} ${z1}C${m} ${z1} ${m} ${y1} ${x0} ${y1}Z" style="fill:${c};opacity:.22"/>`};
  let links='',nodes='',mo=0;
  L.forEach((l,i)=>{const z0=M.y+mo,z1=z0+l.amount/T*M.h;mo+=l.amount/T*M.h;links+=rib(XL+BW,l.y,l.y+l.h,XM,z0,z1,col(l,i))});
  let mo2=0;
  R.forEach((r,i)=>{const y0=M.y+mo2,y1=y0+r.amount/T*M.h;mo2+=r.amount/T*M.h;links+=rib(XM+BW,y0,y1,XR,r.y,r.y+r.h,col(r,i))});
  const cut=s=>s.length>5?s.slice(0,4)+'…':s;
  const node=(nd,x,i,anchor,tx)=>{
    const cy=nd.y+nd.h/2;
    nodes+=`<rect data-id="${nd.id}" x="${x}" y="${nd.y}" width="${BW}" height="${nd.h}" style="fill:${col(nd,i)}"/>`
      +`<text x="${tx}" y="${cy-2}" text-anchor="${anchor}" style="font-size:12px;font-weight:600;fill:var(--fg)">${esc(cut(nd.name))}</text>`
      +`<text x="${tx}" y="${cy+12}" text-anchor="${anchor}" style="font-size:11px;fill:var(--mute)">₩${fmt(nd.amount)}</text>`;
  };
  L.forEach((nd,i)=>node(nd,XL,i,'end',XL-8));
  R.forEach((nd,i)=>node(nd,XR,i,'start',XR+BW+8));
  nodes+=`<rect data-id="inc" x="${XM}" y="${M.y}" width="${BW}" height="${M.h}" style="fill:${col(M,0)}"/>`;
  svg.setAttribute('viewBox',`0 0 360 ${H+PAD+10}`);
  svg.innerHTML=links+nodes;
}
function renderTrend(){
  const b=baseM(),sel=smo;
  const items4=[-2,-1,0,1].map(k=>{
    const m=sel+k,v=build(m).net;
    return {k,m,v,has:Math.round(v/10000)!==0,est:m>0,label:`${(b+m)%12+1}월`};
  });
  const ctr=items4[2],ref=ctr.has?ctr.v:0;
  const mx=Math.max(...items4.filter(x=>x.has).map(x=>x.v),0);
  const Hc=58,Hmax=88,base=126;
  const sc=ref>0?Hc/ref:(mx>0?Hmax/mx:0);
  let h='';
  items4.forEach((x,i)=>{
    const cx=25+50*i;
    let bh,fill,ex='',txt='';
    if(!x.has){bh=8;fill='var(--bg)';ex=' stroke="var(--mute)" stroke-width="1.2" stroke-dasharray="1.5 2.5"'}
    else{
      bh=x.v>0?Math.min(Hmax,Math.max(3,x.v*sc)):3;
      fill=x.est?(x.k===0?'color-mix(in srgb,var(--mute) 42%,var(--bg))':'color-mix(in srgb,var(--mute) 22%,var(--bg))'):x.k===0?'var(--sub)':'color-mix(in srgb,var(--mute) 45%,var(--bg))';
      if(x.est)ex=` stroke="${x.k===0?'var(--sub)':'var(--mute)'}" stroke-width="1.2" stroke-dasharray="3 2.5"`;
      txt=`<text x="${cx}" y="${base-bh-5}" text-anchor="middle" style="font-size:9px;font-weight:600;fill:var(--fg)">${fmtMan(x.v)}</text>`;
    }
    h+=`<rect x="${cx-17}" y="${base-bh}" width="34" height="${bh}" rx="5" style="fill:${fill}"${ex}/>`+txt
      +`<text x="${cx}" y="148" text-anchor="middle" style="font-size:10px;font-weight:${x.k===0?700:500};fill:${x.k===0?'var(--fg)':'var(--mute)'}">${x.label}</text>`;
  });
  $('#tsvg').innerHTML=h;
}
const flowsOf=(k,key)=>flows.filter(f=>f.kind===k&&f.month===key).sort((a,b)=>b.amount-a.amount);
function renderStats(){
  const M=baseM()+smo,key=keyOf(M);
  $('#smlabel').textContent=`${Math.floor(M/12)}년 ${M%12+1}월`;
  const mk=k=>flowsOf(k,key).map(f=>({id:'f:'+f.id,type:k,name:f.name,amount:f.amount}));
  const ins=mk('in'),outs=mk('out');
  const I=ins.reduce((s,x)=>s+x.amount,0),E=outs.reduce((s,x)=>s+x.amount,0);
  $('#sk').classList.toggle('empty',!(I||E));
  sankey($('#isvg'),ins,outs,I,E);
  renderTrend();
}
function renderRecords(){
  const M=baseM()+rmo,key=keyOf(M);
  $('#rmlabel').textContent=`${Math.floor(M/12)}년 ${M%12+1}월`;
  const rows=[...flowsOf('in',key),...flowsOf('out',key)].map(f=>`<div class="row" data-fid="${f.id}">${rowHtml({type:f.kind,name:f.name,amount:f.amount})}</div>`);
  $('#rlist').innerHTML=rows.length?rows.join(''):'<div class="cemp">데이터가 없습니다</div>';
}

}
const closeModal=()=>{$('#ov').classList.remove('open');closeFlow()};
function closeFlow(){$('#nav').classList.remove('exp','m-flow','m-name');$('#dock').classList.remove('exp');$('#scrim').classList.remove('on');document.activeElement&&document.activeElement.blur&&document.activeElement.blur()}
const flowOpen=()=>$('#nav').classList.contains('exp');
$('#add').onclick=()=>{if(flowOpen()){closeFlow();return}openEntry(tab===1?'in':'asset')};
// entry popup (자산) on the expanding dock
const popKey=()=>keyOf(baseM()+tabMo());
let ent=null;
const blankEnt=()=>({adj:0,src:null,id:null,month:null,kind:'asset',atype:'cash',name:'',amount:'',cur:'USD',usd:'',krw:''});
function syncEnt(){
  const map={iname:'name',iamt:'amount',iusd:'usd',ikrw:'krw',icur:'cur'};
  Object.entries(map).forEach(([id,k])=>{const e=$('#'+id);if(e)ent[k]=e.value});
}
function bodyHtml(){
  const e=ent,v=x=>esc(String(x==null?'':x));
  const save='<button type="submit" class="xok">저장</button>';
  const name=`<input id="iname" placeholder="이름" maxlength="30" value="${v(e.name)}">`;
  const amt=d=>`<input id="iamt" placeholder="금액" inputmode="decimal" data-d="${d}" value="${v(e.amount)}">`;
  if(e.kind!=='asset')return `<label class="f">${name}</label><div class="xr">${amt(0)}${save}</div>`;
  if(e.atype==='sec')
    return `<label class="f">${name}</label><div class="xr"><input id="iusd" placeholder="금액($)" inputmode="decimal" data-d="2" value="${v(e.usd)}"><input id="ikrw" placeholder="금액(₩)" inputmode="decimal" data-d="0" value="${v(e.krw)}"></div><div class="xr r">${save}</div>`;
  if(e.atype==='fx')
    return `<div class="xr">${name}<select id="icur">${Object.keys(CURS).map(c=>`<option${c===e.cur?' selected':''}>${c}</option>`).join('')}</select></div><div class="xr">${amt(e.cur==='JPY'?0:2)}${save}</div>`;
  return `<label class="f">${name}</label><div class="xr">${amt(0)}${save}</div>`;
}
function layoutPop(){$('#nav').style.setProperty('--xh',$('#iform').offsetHeight+'px')}
function renderPop(){
  document.querySelectorAll('#atypes button').forEach(b=>b.classList.toggle('on',b.dataset.a===ent.atype));
  document.querySelectorAll('#ktypes button').forEach(b=>b.classList.toggle('on',b.dataset.k===ent.kind));
  $('#atypes').classList.toggle('hide',ent.kind!=='asset');
  $('#ktypes').classList.toggle('hide',ent.kind==='asset');
  $('#xbody').innerHTML=bodyHtml();
  $('#idel').classList.toggle('hide',!ent.id);
  layoutPop();
}
function openEntry(kind,id){
  ent=blankEnt();
  if(kind!=='asset'){
    ent.kind=kind==='out'?'out':'in';
    const f=id?flows.find(v=>v.id===id):null;
    if(f)Object.assign(ent,{id,src:'flow',month:f.month,kind:f.kind,name:f.name,amount:fmtN(f.amount,0)});
  }else if(id){
    const raw=items.find(v=>v.id===id),a=raw?(snapAt(raw,popKey())||raw):null;
    let eff=null;if(a){eff=build(tabMo()).vi.find(x=>x.id===id)||null}
    const adj=(a&&eff&&a.type!=='sec'&&a.amount!=null&&eff.amount!=null)?eff.amount-a.amount:0;
    if(a)Object.assign(ent,{adj,id,src:'asset',month:raw.month||null,atype:a.type,name:a.name,
      cur:a.type==='fx'?a.cur:'USD',
      amount:a.amount!=null?fmtN(a.amount+adj,a.type==='fx'&&a.cur!=='JPY'?2:0):'',
      usd:a.type==='sec'&&a.usd?fmtN(a.usd,2):'',krw:a.type==='sec'&&a.krw?fmtN(a.krw,0):''});
  }
  renderPop();
  $('#dock').classList.add('exp');$('#scrim').classList.add('on');
  $('#nav').classList.add('exp','m-flow');layoutPop();
  setTimeout(()=>$('#iname')&&$('#iname').focus(),380);
}
$('#ktypes').onclick=e=>{const b=e.target.closest('button');if(!b)return;syncEnt();ent.kind=b.dataset.k;renderPop()};
$('#atypes').onclick=e=>{const b=e.target.closest('button');if(!b)return;syncEnt();ent.atype=b.dataset.a;renderPop()};
$('#xbody').addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.d!==undefined)reAmt(t,t.dataset.d!=='0')});
$('#xbody').addEventListener('change',e=>{if(e.target.id==='icur'){syncEnt();renderPop()}});
$('#scrim').addEventListener('pointerdown',e=>{e.preventDefault();closeFlow()});
function commitAll(){ls.set('assets',items);ls.set('flows',flows);render();push();closeFlow()}
$('#idel').onclick=()=>{
  if(!ent||!ent.id)return;
  if(ent.kind==='asset'){const it=items.find(v=>v.id===ent.id);if(it)deleteAssetAt(it,popKey())}
  else flows=flows.filter(v=>v.id!==ent.id);
  commitAll();
};
$('#iform').onsubmit=e=>{
  e.preventDefault();syncEnt();
  const n=s=>parseFloat(String(s).replace(/,/g,''));
  const name=ent.name.trim();if(!name)return;
  const id=ent.id||String(Date.now());
  if(ent.kind!=='asset'){
    const amount=Math.round(n(ent.amount));if(isNaN(amount)||amount<=0)return;
    const o={id,kind:ent.kind,name,amount,month:ent.month||popKey()};
    const ix=flows.findIndex(v=>v.id===ent.id);
    if(ix>=0)flows[ix]=o;else flows.push(o);
    commitAll();return;
  }
  const t=ent.atype;let obj;
  if(t==='sec'){
    const usd=n(ent.usd)||0,krwV=n(ent.krw)||0;
    if(usd<0||krwV<0||(usd===0&&krwV===0))return;
    obj={id,type:'sec',name,usd:Math.round(usd*100)/100,krw:Math.round(krwV)};
  }else{
    let a=n(ent.amount);if(isNaN(a))return;
    if(ent.src==='asset')a-=(ent.adj||0);
    if(a<0&&!(ent.src==='asset'&&ent.adj))return;
    if(t==='fx')obj={id,type:'fx',name,cur:ent.cur,amount:ent.cur==='JPY'?Math.round(a):Math.round(a*100)/100};
    else obj={id,type:t,name,amount:Math.round(a)};
  }
  const cur=ent.src==='asset'?items.find(v=>v.id===ent.id):null;
  if(cur)editAssetFrom(cur,obj,popKey());
  else{const mk=ent.month||popKey();items.push({...obj,month:mk,from:mk})}
  commitAll();
};
$('#cancel').onclick=closeModal;
$('#ov').addEventListener('pointerdown',e=>{if(e.target.id==='ov')closeModal()});
$('#del').onclick=()=>{items=items.filter(v=>v.id!==editId);save();closeModal()};
$('#form').onsubmit=e=>{
  e.preventDefault();
  const name=$('#name').value.trim();
  if(curType==='sec'){
    const ticker=$('#ticker').value.trim(),price=parseFloat($('#price').value.replace(/,/g,'')),qty=parseFloat($('#qty').value.replace(/,/g,''));
    if(!name||!ticker||isNaN(price)||price<0||isNaN(qty)||qty<=0)return;
    items.push({id:String(Date.now()),type:'sec',name,ticker,price,qty,cur:$('#scur').value});
    save();closeModal();return;
  }
  const amount=parseFloat($('#amount').value.replace(/,/g,''));
  if(!name||isNaN(amount)||amount<0)return;
  const o={id:editId||String(Date.now()),type:curType,name,amount:curType==='fx'?amount:Math.round(amount)};
  if(curType==='fx')o.cur=$('#cur').value;
  if(editId)items=items.map(v=>v.id===editId?o:v);else items.push(o);
  save();closeModal();
};
function save(){ls.set('assets',items);render();push()}

// inline detail editing
const list=$('#list');
list.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const row=b.closest('.row[data-id]'),id=row.dataset.id;
  if(b.dataset.act==='del'){
    if(confirm('삭제할까요?')){items=items.filter(v=>v.id!==id);openId=null;editing=false;save()}
    return;
  }
  editing=!editing;
  const d=row.querySelector('.detail');d.classList.toggle('edit',editing);b.classList.toggle('on',editing);
  d.querySelectorAll('input').forEach(x=>x.readOnly=!editing);
  d.querySelectorAll('select').forEach(x=>x.disabled=!editing);
  if(editing){const f=d.querySelector('input');if(f)f.focus()}else document.activeElement&&document.activeElement.blur();
});
list.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.d!==undefined)reAmt(el,el.dataset.d!=='0')});
list.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input'))e.target.blur()});
list.addEventListener('change',e=>{
  const el=e.target,row=el.closest('.row[data-id]');if(!el.dataset||!el.dataset.f||!row)return;
  const it=items.find(v=>v.id===row.dataset.id);if(!it)return;
  const k=el.dataset.f;let v=el.value.trim();
  if(k==='name'||k==='ticker'){if(v)it[k]=v;el.value=it[k]}
  else if(k==='cur'){it.cur=v;if(it.type==='fx'){const a=row.querySelector('[data-f="amount"]');if(a)a.value=fmtN(it.amount,v==='JPY'?0:2);if(v==='JPY')it.amount=Math.round(it.amount)}}
  else{
    let n=parseFloat(v.replace(/,/g,''));
    if(isNaN(n)||n<0||(k==='qty'&&n<=0)){el.value=fmtN(it[k],+el.dataset.d)}
    else{if(k==='amount')n=it.type==='fx'&&it.cur!=='JPY'?Math.round(n*100)/100:Math.round(n);it[k]=n;el.value=fmtN(n,+el.dataset.d)}
  }
  ls.set('assets',items);render(true);push();
});

// tap = edit, long press = drag to reorder
let pt=null,st=null,dr=null;
const rows=()=>[...list.querySelectorAll('.row[data-id]')];
function endPress(){clearTimeout(pt);document.querySelectorAll('.row.press').forEach(r=>r.classList.remove('press'))}
list.addEventListener('pointerdown',e=>{
  if(e.target.closest('.detail'))return;
  const row=e.target.closest('.row[data-id]');if(!row||dr)return;
  st={row,id:row.dataset.id,x:e.clientX,y:e.clientY};
  row.classList.add('press');
  pt=setTimeout(startDrag,420);
});
function startDrag(){
  if(openId){openId=null;editing=false;render()}
  const row=list.querySelector(`.row[data-id="${st.id}"]`);if(!row){st=null;return}row.classList.remove('press');
  const all=rows(),rects=all.map(x=>x.getBoundingClientRect()),d=all.indexOf(row);
  navigator.vibrate&&navigator.vibrate(10);
  dr={row,all,d,t:d,h:rects[d].height,mid:rects.map(r=>r.top+r.height/2),grab:st.y-rects[d].top,top0:rects[d].top,sy:scrollY};
  row.classList.add('drag');hideTip();
}
function moveDrag(y){
  const ds=scrollY-dr.sy;
  dr.row.style.transform=`translateY(${y-dr.grab-dr.top0-ds}px) scale(1.02)`;
  const c=y-dr.grab+dr.h/2-ds;
  let t=0;dr.mid.forEach((m,k)=>{if(k!==dr.d&&m<c)t++});
  dr.t=t;
  dr.all.forEach((x,k)=>{
    if(k===dr.d)return;
    let o=0;
    if(t>dr.d&&k>dr.d&&k<=t)o=-dr.h;
    if(t<dr.d&&k>=t&&k<dr.d)o=dr.h;
    x.style.transform=o?`translateY(${o}px)`:'';
  });
}
document.addEventListener('pointermove',e=>{
  if(dr){moveDrag(e.clientY);return}
  if(st&&Math.hypot(e.clientX-st.x,e.clientY-st.y)>8){endPress();st=null}
});
document.addEventListener('pointerup',()=>{
  if(dr){
    const ids=dr.all.map(x=>x.dataset.id),mv=ids.splice(dr.d,1)[0];ids.splice(dr.t,0,mv);
    {const set=new Set(ids),q=ids.map(id=>items.find(v=>v.id===id));let kq=0;items=items.map(it=>set.has(it.id)?q[kq++]:it)}
    dr=null;st=null;save();return;
  }
  if(st){const row=st.row;endPress();st=null;if(!flowOpen())openEntry('asset',row.dataset.id)}
});
document.addEventListener('pointercancel',()=>{endPress();if(!dr)st=null});
document.addEventListener('touchmove',e=>{if(dr)e.preventDefault()},{passive:false});
list.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// rates (free, no key)
async function loadRates(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/KRW');
    const j=await r.json();
    if(j.rates){for(const c of Object.keys(CURS))if(j.rates[c])rates[c]=1/j.rates[c]}
  }catch{
    try{
      const r=await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,CNY');
      const j=await r.json();
      for(const c of Object.keys(CURS))if(j.rates&&j.rates[c])rates[c]=1/j.rates[c];
    }catch{}
  }
  ls.set('rates',rates);if(!dr)render(editing);
}

const rpc=(fn,body)=>fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SKEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.ok?r.json():Promise.reject());
let pushT=null;
function push(){clearTimeout(pushT);pushT=setTimeout(()=>{pushT=null;rpc('moakr_set',{k:SK,d:{items,flows,name:ls.get('name','사용자')}}).catch(()=>{})},400)}
async function pull(){
  try{
    const d=await rpc('moakr_get',{k:SK});
    if(pushT||dr||editing||$('#ov').classList.contains('open')||flowOpen())return;
    if(d&&Array.isArray(d.items)){

      if(d.name&&d.name!==ls.get('name','사용자')){ls.set('name',d.name);nmEl.textContent=d.name}

}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
render();pull();loadRates();setInterval(loadRates,300000);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
