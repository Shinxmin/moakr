<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자산</title>
<style>
:root{
  --bg:#f6f6f4;--fg:#1a1a1a;--mute:#8a8a86;--line:rgba(0,0,0,.07);
  --glass:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.7);--shadow:0 12px 40px rgba(0,0,0,.12);
  --r:24px;
  --c-cash:#5b7c99;--c-fx:#b0813f;--c-save:#6b8f71;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--fg:#ececea;--mute:#8a8a86;--line:rgba(255,255,255,.08);
  --glass:rgba(40,40,40,.62);--glass-b:rgba(255,255,255,.1);--shadow:0 12px 40px rgba(0,0,0,.5);
  --c-cash:#7fa2c2;--c-fx:#d6a45f;--c-save:#8db894}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Pretendard","Noto Sans KR",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
.add{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-b);background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--fg);font-size:22px;font-weight:300;
  line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.add:active{transform:scale(.94)}
.chart{position:relative;width:min(100%,340px);margin:14px auto 28px;aspect-ratio:1}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:pan-y}
.seg{fill:none;stroke-width:26;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.seg.on{stroke-width:32}
.dim .seg:not(.on){opacity:.35}
.ring-empty{fill:none;stroke:var(--line);stroke-width:26}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.center b{font-size:26px;font-weight:600;letter-spacing:-.03em}
.center span{font-size:12px;color:var(--mute);margin-top:2px}
/* tags */
.pill{display:inline-block;font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;font-weight:600;letter-spacing:-.01em;
  color:#fff;background:var(--pc);border:1px solid rgba(255,255,255,.35)}
.t-cash{--pc:var(--c-cash)}.t-fx{--pc:var(--c-fx)}.t-save{--pc:var(--c-save)}
/* tooltip */
#tip{position:fixed;z-index:20;pointer-events:none;min-width:150px;max-width:240px;padding:14px 16px 13px;border-radius:var(--r);
  background:var(--glass);border:1px solid var(--glass-b);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.show{opacity:1;transform:none}
#tip .pill{margin-bottom:9px;box-shadow:0 0 0 3px var(--glass)}
#tip .n{font-size:14px;font-weight:600;margin-bottom:3px;word-break:break-all}
#tip .a{font-size:15px;font-variant-numeric:tabular-nums}
#tip .k{font-size:11px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
/* list */
.list{display:flex;flex-direction:column;gap:2px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s,transform .15s}
.row.press{transform:scale(.985);opacity:.7}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .l{flex:1;min-width:0}
.row .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.row .pill{font-size:10px;padding:3px 8px}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{display:block;font-size:15px;font-weight:500}
.row .r small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
/* modal */
.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.open{display:flex;animation:f .15s}
@keyframes f{from{opacity:0}}
.modal{width:100%;max-width:380px;border-radius:var(--r);padding:22px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);animation:u .18s}
@keyframes u{from{transform:translateY(10px);opacity:0}}
.modal h2{margin:0 0 18px;font-size:16px;font-weight:600}
.seg-t{display:flex;gap:6px;margin-bottom:14px}
.seg-t button{flex:1;padding:9px 0;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.seg-t button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.f{display:block;margin-bottom:10px}
input,select{width:100%;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus{border-color:var(--mute)}
.amt{display:flex;gap:8px}.amt select{width:96px;flex:none}
.btns{display:flex;gap:8px;margin-top:16px}
.btns button{flex:1;padding:13px 0;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.btns .ok{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btns .del{color:#c0504d;flex:.6}
.hide{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>자산</h1><button class="add" id="add" aria-label="추가">+</button></header>
  <div class="chart" id="chart">
    <svg viewBox="0 0 200 200" id="svg"></svg>
    <div class="center"><b id="total">₩0</b></div>
  </div>
  <div class="list" id="list"></div>
</main>
<div id="tip"></div>
<div class="ov" id="ov"><form class="modal" id="form" autocomplete="off">
  <h2 id="mt">종목 추가</h2>
  <div class="seg-t" id="types"></div>
  <label class="f"><input id="name" placeholder="계좌명" required maxlength="30"></label>
  <div class="amt">
    <select id="cur" class="hide"></select>
    <input id="amount" placeholder="금액" inputmode="decimal" required>
  </div>
  <div class="btns">
    <button type="button" class="del hide" id="del">삭제</button>
    <button type="button" id="cancel">취소</button>
    <button type="submit" class="ok">저장</button>
  </div>
</form></div>
<script>
const TYPES={cash:'입출금',fx:'외화',save:'예적금'};
const CURS={USD:'$',JPY:'¥',CNY:'CN¥'};
const COLORS={cash:'--c-cash',fx:'--c-fx',save:'--c-save'};
const $=s=>document.querySelector(s);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let items=ls.get('assets',[]);
let rates=ls.get('rates',{USD:0,JPY:0,CNY:0}); // KRW per 1 unit
let editId=null,curType='cash';
const fmt=(n,d=0)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const krw=i=>i.type==='fx'?i.amount*(rates[i.cur]||0):i.amount;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=i=>i.type==='fx'?CURS[i.cur]+fmt(i.amount,i.cur==='JPY'?0:2):'₩'+fmt(i.amount);
const sub=i=>i.type==='fx'&&rates[i.cur]?'≈ ₩'+fmt(Math.round(krw(i))):'';
const pill=t=>`<span class="pill t-${t}">${TYPES[t]}</span>`;

// colors: per-type hue, varying lightness per account
function shade(i,idx){
  const base=css(COLORS[i.type]);
  const same=items.filter(x=>x.type===i.type);
  const k=same.indexOf(i);
  return `color-mix(in srgb, ${base} ${Math.max(45,100-k*14)}%, ${css('--bg')})`;
}

function arc(a0,a1,r){
  const p=a=>[100+r*Math.sin(a),100-r*Math.cos(a)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;
}

function render(){
  const total=items.reduce((s,i)=>s+krw(i),0);
  $('#total').textContent='₩'+fmt(Math.round(total));
  const svg=$('#svg');
  let h='<circle class="ring-empty" cx="100" cy="100" r="78"/>';
  if(total>0){
    let a=0;const gap=items.length>1?0.025:0;
    items.forEach(i=>{
      const v=krw(i);if(v<=0)return;
      const span=v/total*Math.PI*2;
      const s=a+gap/2,e=Math.min(a+span-gap/2,a+Math.PI*2-0.0001);
      h+=`<path class="seg" data-id="${i.id}" d="${arc(s,Math.max(e,s+0.001),78)}" stroke="${shade(i)}"/>`;
      a+=span;
    });
  }
  svg.innerHTML=h;
  $('#list').innerHTML=items.map(i=>`<div class="row" data-id="${i.id}">
    <span class="dot" style="background:${shade(i)}"></span>
    <div class="l"><div class="nm">${esc(i.name)}</div>${pill(i.type)}</div>
    <div class="r"><b>${main(i)}</b><small>${sub(i)}</small></div></div>`).join('');
}

// tooltip
const tip=$('#tip');
function showTip(id,x,y){
  const i=items.find(v=>v.id===id);if(!i)return;
  tip.innerHTML=`${pill(i.type)}<div class="n">${esc(i.name)}</div><div class="a">${main(i)}</div>${sub(i)?`<div class="k">${sub(i)}</div>`:''}`;
  tip.classList.add('show');
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  let l=x+16,t=y-hh-14;
  if(l+w>innerWidth-10)l=x-w-16;
  if(l<10)l=10;
  if(t<10)t=y+18;
  tip.style.left=l+'px';tip.style.top=t+'px';
  $('#chart').classList.add('dim');
  document.querySelectorAll('.seg').forEach(s=>s.classList.toggle('on',s.dataset.id===id));
}
function hideTip(){tip.classList.remove('show');$('#chart').classList.remove('dim');document.querySelectorAll('.seg.on').forEach(s=>s.classList.remove('on'))}
const svgEl=$('#svg');
function probe(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(el&&el.classList&&el.classList.contains('seg'))showTip(el.dataset.id,e.clientX,e.clientY);else hideTip();
}
svgEl.addEventListener('pointermove',probe);
svgEl.addEventListener('pointerdown',probe);
svgEl.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hideTip()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#svg'))hideTip()});

// modal
function buildTypes(){
  $('#types').innerHTML=Object.entries(TYPES).map(([k,v])=>`<button type="button" data-t="${k}" class="${k===curType?'on':''}">${v}</button>`).join('');
  $('#cur').classList.toggle('hide',curType!=='fx');
}
$('#cur').innerHTML=Object.keys(CURS).map(c=>`<option>${c}</option>`).join('');
$('#types').onclick=e=>{const b=e.target.closest('button');if(!b)return;curType=b.dataset.t;buildTypes()};
function openModal(id){
  editId=id||null;const i=items.find(v=>v.id===id);
  curType=i?i.type:'cash';
  $('#mt').textContent=i?'종목 수정':'종목 추가';
  $('#name').value=i?i.name:'';
  $('#amount').value=i?String(i.amount):'';
  $('#cur').value=i&&i.cur?i.cur:'USD';
  $('#del').classList.toggle('hide',!i);
  buildTypes();$('#ov').classList.add('open');
  setTimeout(()=>$('#name').focus(),50);
}
const closeModal=()=>$('#ov').classList.remove('open');
$('#add').onclick=()=>openModal();
$('#cancel').onclick=closeModal;
$('#ov').addEventListener('pointerdown',e=>{if(e.target.id==='ov')closeModal()});
$('#del').onclick=()=>{items=items.filter(v=>v.id!==editId);save();closeModal()};
$('#form').onsubmit=e=>{
  e.preventDefault();
  const amount=parseFloat($('#amount').value.replace(/,/g,''));
  const name=$('#name').value.trim();
  if(!name||isNaN(amount)||amount<0)return;
  const o={id:editId||String(Date.now()),type:curType,name,amount:curType==='fx'?amount:Math.round(amount)};
  if(curType==='fx')o.cur=$('#cur').value;
  if(editId)items=items.map(v=>v.id===editId?o:v);else items.push(o);
  save();closeModal();
};
function save(){ls.set('assets',items);render()}

// long press
let pt=null,pressed=false,sx=0,sy=0;
const list=$('#list');
list.addEventListener('pointerdown',e=>{
  const r=e.target.closest('.row');if(!r)return;
  pressed=false;sx=e.clientX;sy=e.clientY;r.classList.add('press');
  pt=setTimeout(()=>{pressed=true;r.classList.remove('press');navigator.vibrate&&navigator.vibrate(10);openModal(r.dataset.id)},500);
});
const cancelP=()=>{clearTimeout(pt);document.querySelectorAll('.row.press').forEach(r=>r.classList.remove('press'))};
list.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)cancelP()});
['pointerup','pointerleave','pointercancel'].forEach(t=>list.addEventListener(t,cancelP));
list.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// rates (free, no key)
async function loadRates(){
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/KRW');
    const j=await r.json();
    if(j.rates){for(const c of Object.keys(CURS))if(j.rates[c])rates[c]=1/j.rates[c]}
  }catch{
    try{
      const r=await fetch('https://api.frankfurter.app/latest?from=KRW&to=USD,JPY,CNY');
      const j=await r.json();
      for(const c of Object.keys(CURS))if(j.rates&&j.rates[c])rates[c]=1/j.rates[c];
    }catch{}
  }
  ls.set('rates',rates);render();
}
render();loadRates();setInterval(loadRates,300000);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',render);
</script>
</body>
</html>
